name: "[VehereGo] Build Release (Cached)"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v-cached-*'

jobs:
  build_and_release_cached:
    name: Build AAB & Universal APK (Gradle Cached)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Checkout packages repository
        uses: actions/checkout@v4
        with:
          repository: choicenew/packages
          path: packages
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Sync packages into veherego/packages
        run: |
          mkdir -p veherego/packages
          cp -rn packages/* veherego/packages/ 2>/dev/null || true

      - name: Cloud Monorepo Highest Version & Workspace Harmonizer
        run: |
          python3 -c "
          import os, glob, re
          dep_highest_versions = {}
          for p in glob.glob('packages/**/pubspec.yaml', recursive=True) + glob.glob('**/packages/**/pubspec.yaml', recursive=True):
              if 'build/' in p or '.dart_tool/' in p: continue
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
                  for line in content.splitlines():
                      m = re.match(r'^\s*([a-zA-Z0-9_]+):\s*\^?([0-9]+\.[0-9]+\.[0-9]+)', line)
                      if m:
                          dep_name, dep_ver = m.group(1), m.group(2)
                          if dep_name in ('flutter', 'sdk', 'veherego', 'name', 'version', 'path'): continue
                          if dep_name not in dep_highest_versions:
                              dep_highest_versions[dep_name] = dep_ver
                          else:
                              curr_tuple = tuple(map(int, dep_ver.split('.')))
                              max_tuple = tuple(map(int, dep_highest_versions[dep_name].split('.')))
                              if curr_tuple > max_tuple:
                                  dep_highest_versions[dep_name] = dep_ver
          overrides = ['dependency_overrides:']
          for k, v in dep_highest_versions.items():
              overrides.append(f'  {k}: ^{v}')
          target_file = 'veherego/pubspec_overrides.yaml' if os.path.exists('veherego') else 'pubspec_overrides.yaml'
          with open(target_file, 'w', encoding='utf-8') as f:
              f.write('\n'.join(overrides) + '\n')
          target_file = 'veherego/pubspec_overrides.yaml' if os.path.exists('veherego') else 'pubspec_overrides.yaml'
          with open(target_file, 'w', encoding='utf-8') as f:
              f.write('\n'.join(overrides) + '\n')
          "

      - name: Locate Flutter Project
        run: |
          if [ -f "veherego/pubspec.yaml" ] && [ -d "veherego/android" ]; then
            VEHEREGO_DIR="veherego"
          else
            VEHEREGO_DIR=$(find veherego -path 'veherego/packages*' -prune -o -type f -name pubspec.yaml -print0 | while IFS= read -r -d '' manifest; do
              project_dir=${manifest%/pubspec.yaml}
              if [ -d "$project_dir/android" ]; then
                printf '%s' "$project_dir"
                break
              fi
            done)
          fi
          if [ -z "$VEHEREGO_DIR" ]; then
            echo "Unable to locate the VehereGo Flutter project"
            find veherego -name pubspec.yaml -print
            exit 1
          fi
          echo "VEHEREGO_DIR=$VEHEREGO_DIR" >> "$GITHUB_ENV"
          echo "Using Flutter project at $VEHEREGO_DIR"

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="test-${APP_VER}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format='%h - %s')" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Release Version] 发布版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode keystore and create key.properties
        run: |
          mkdir -p "$VEHEREGO_DIR/android/app"
          echo "${{ secrets.VEHEREGO_KEYSTORE_BASE64 }}" | base64 -d > "$VEHEREGO_DIR/android/app/key.jks"
          echo "storePassword=${{ secrets.VEHEREGO_KEYSTORE_PASSWORD }}" > "$VEHEREGO_DIR/android/key.properties"
          echo "keyPassword=${{ secrets.VEHEREGO_KEY_PASSWORD }}" >> "$VEHEREGO_DIR/android/key.properties"
          echo "keyAlias=${{ secrets.VEHEREGO_KEYSTORE_ALIAS }}" >> "$VEHEREGO_DIR/android/key.properties"
          echo "storeFile=key.jks" >> "$VEHEREGO_DIR/android/key.properties"

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Sync Store Manifest to App Local Assets
        run: |
          if [ -f "veherego_assets/store_manifest.json" ]; then
            cp -f veherego_assets/store_manifest.json veherego/assets/store_manifest.json
            echo "✅ Successfully synced latest store_manifest.json to veherego/assets/store_manifest.json"
          fi

      - name: Install Dependencies
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android App Bundle (AAB) & Signed Release APK
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          echo "=========================================================================="
          echo "🛡️ 开始全量构建 Play & GitHub 双渠道 Release APK 与 AAB (Gradle Cached)..."
          echo "=========================================================================="
          flutter build appbundle --release --flavor play --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          flutter build apk --release --flavor play --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          flutter build appbundle --release --flavor github --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          flutter build apk --release --flavor github --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          
          mkdir -p release_assets
          cp build/app/outputs/bundle/playRelease/app-play-release.aab release_assets/veherego-v${{ env.APP_VERSION }}-play-release.aab
          cp build/app/outputs/flutter-apk/app-play-release.apk release_assets/veherego-v${{ env.APP_VERSION }}-play-release.apk
          cp build/app/outputs/bundle/githubRelease/app-github-release.aab release_assets/veherego-v${{ env.APP_VERSION }}-github-release.aab
          cp build/app/outputs/flutter-apk/app-github-release.apk release_assets/veherego-v${{ env.APP_VERSION }}-github-release.apk
          cp build/app/outputs/flutter-apk/app-github-release.apk "../veherego-release-universal.apk"
          echo "=========================================================================="
          echo "✅ 4 项全量产物（Play AAB/APK + GitHub AAB/APK）编译导出成功！版本号: ${{ env.APP_VERSION }} + ${{ env.APP_BUILD_NUMBER }}"
          echo "=========================================================================="

      - name: Publish Release to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: veherego-v${{ env.APP_VERSION }}-release-cached
          name: "veherego Release (Cached) v${{ env.APP_VERSION }}"
          body: |
            ## veherego - 正式发布版本 #${{ env.APP_BUILD_NUMBER }} (Gradle Cached)
            - **应用名**: `veherego`
            - **版本号**: `${{ env.APP_VERSION }}`
            - **Build Number**: `${{ env.APP_BUILD_NUMBER }}`
            - **最新 Commit 记录**: `${{ env.COMMIT_MSG }}`
            - **打包产物**: `veherego-v${{ env.APP_VERSION }}-release.apk` / `veherego-v${{ env.APP_VERSION }}-release.aab` (统一固定签名，支持直装实机测试)
          draft: false
          prerelease: false
          files: ${{ env.VEHEREGO_DIR }}/release_assets/*.{apk,aab}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}