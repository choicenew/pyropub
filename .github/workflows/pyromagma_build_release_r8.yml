name: "[PyroMagma] Build Release (R8)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_all_plugins:
        description: 'Include ALL sample plugins (Default: false = Academic plugins only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build_release:
    name: Build R8 Obfuscated Release APK & AAB & GitHub Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'r8') || contains(github.event.head_commit.message, 'R8') || contains(github.event.head_commit.message, 'release') || contains(github.event.head_commit.message, 'RELEASE') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout pyropub
        uses: actions/checkout@v4

      - name: Checkout pyro_magma
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pyro_magma
          path: pyro_magma
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Checkout packages
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/packages
          path: packages
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Checkout legado_parser
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/legado_parser
          path: legado_parser
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Inject Prebuilt Supported Languages JSON
        run: |
          mkdir -p packages/pyro_api_translate/assets
          if [ -f "supported_languages.json" ]; then
            cp supported_languages.json packages/pyro_api_translate/assets/supported_languages.json
            echo "✓ 已将仓库预置的 supported_languages.json 注入 packages/pyro_api_translate/assets/"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies & Upgrade Git Packages
        working-directory: ./pyro_magma
        run: |
          flutter pub upgrade onnxruntime_v2
          flutter pub get

      - name: 🚀 Precompile Pyro Hetu Script Engine Bytecode (.ht -> .out)
        run: |
          dart packages/core/pyro_hetu_script_engine/bin/compile_sdk.dart

      - name: Sync L10n to Native Android & iOS Strings
        working-directory: ./pyro_magma
        run: |
          dart run tools/sync_l10n.dart

      - name: Extract Dynamic Version from pubspec.yaml
        working-directory: ./pyro_magma
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format='%h - %s')" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Release Version] 发布版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Decode keystore and create key.properties
        working-directory: ./pyro_magma
        run: |
          mkdir -p android/app
          echo "${{ secrets.PYROMAGMA_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.PYROMAGMA_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.PYROMAGMA_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.PYROMAGMA_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties

      - name: ✂️ Prune Sample Plugins (Play Store / Academic Compliance Guard)
        run: |
          MODE="academic_only"
          if [ "${{ github.event.inputs.include_all_plugins }}" == "true" ]; then
            MODE="all"
          fi
          echo "Executing sample plugin pruning task with mode: $MODE"
          python pyro_magma/tools/prune_sample_plugins.py "$MODE"

      - name: Build Release APK with R8 Proguard Obfuscation
        working-directory: ./pyro_magma
        run: |
          echo "=========================================================================="
          echo "🛡️ 开始全量 R8 混淆编译 (Release APK)..."
          echo "=========================================================================="
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          echo "=========================================================================="
          echo "✅ Release APK 编译完成！"
          echo "=========================================================================="

      - name: Build Release App Bundle (AAB) with R8
        working-directory: ./pyro_magma
        run: |
          echo "=========================================================================="
          echo "📦 开始编译 Release App Bundle (AAB)..."
          echo "=========================================================================="
          flutter build appbundle --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          echo "=========================================================================="
          echo "✅ Release AAB 编译完成！"
          echo "=========================================================================="

      - name: Prepare Release Assets (APK & AAB)
        working-directory: ./pyro_magma
        run: |
          mkdir -p release_assets
          SUFFIX=""
          if [ "${{ github.event.inputs.include_all_plugins }}" == "true" ]; then
            SUFFIX="-all"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/pyro_magma-v${{ env.APP_VERSION }}-github-release${SUFFIX}.apk
          cp build/app/outputs/bundle/release/app-release.aab release_assets/pyro_magma-v${{ env.APP_VERSION }}-playstore-release${SUFFIX}.aab
          ls -lh release_assets/

      - name: Publish R8 Release APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pyromagma-v${{ env.APP_VERSION }}-release-r8
          name: "pyromagma Release v${{ env.APP_VERSION }} (R8 Obfuscated)"
          body: |
            ## pyromagma - 正式发布版本 v${{ env.APP_VERSION }} (Build #${{ env.APP_BUILD_NUMBER }})
            - **应用名**: `pyromagma`
            - **版本号**: `${{ env.APP_VERSION }}`
            - **最新 Commit 记录**: `${{ env.COMMIT_MSG }}`
            - **混淆状态**: 已通过全量 R8 混淆、字节码压缩与 Proguard 规则校验
            - **产物 1**: `pyro_magma-v${{ env.APP_VERSION }}-release-r8.apk` (直接测试安装包)
            - **产物 2**: `pyro_magma-v${{ env.APP_VERSION }}-release-r8.aab` (Google Play 上架专用包)
          draft: false
          prerelease: false
          files: ./pyro_magma/release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
