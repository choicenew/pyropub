name: "[VehereGo] Distribute AAB to Google Play Store"

on:
  workflow_run:
    workflows: ["[VehereGo] Build Release (R8)", "[VehereGo] Build Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy_to_playstore:
    name: Deploy VehereGo AAB to Google Play
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Details and Download Play AAB from GitHub Release
        id: fetch_data
        run: |
          set -e
          echo "Fetching latest VehereGo release tag..."
          SOURCE_TAG=$(gh release list --repo ${{ github.repository }} --limit 10 --json tagName --jq '.[] | select(.tagName | startswith("veherego-v")) | .tagName' | head -n 1)
          if [ -z "$SOURCE_TAG" ]; then
            echo "::error::No VehereGo release tag found."
            exit 1
          fi
          echo "Found tag: $SOURCE_TAG"
          mkdir -p release_assets
          # 仅下载专门用于 Google Play 的 Play Flavor 专属包 (*play*.aab)
          gh release download "$SOURCE_TAG" --repo ${{ github.repository }} --pattern "*play*.aab" --dir release_assets
          
          VERSION_CODE=$(echo "$SOURCE_TAG" | sed 's/.*[+|-]//')
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Create Google Play Release Notes
        run: |
          mkdir -p release_notes/en-US
          echo "VehereGo Official Release Build ${{ steps.fetch_data.outputs.version_code }}" > release_notes/en-US/${{ steps.fetch_data.outputs.version_code }}.txt

      - name: Deploy Play Flavor AAB to Google Play Store (Production Track)
        id: deploy_production
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.VEHEREGO_PLAY_STORE_SERVICE_ACCOUNT || secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.VEHEREGO_PACKAGE_NAME || 'com.mypyro.veherego' }}
          releaseFiles: "release_assets/*play*.aab"
          tracks: production
          whatsNewDirectory: release_notes
          status: completed
          changesNotSentForReview: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Deploy Play Flavor AAB to Google Play Store (Closed Testing - Alpha Track)
        id: deploy_alpha
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.VEHEREGO_PLAY_STORE_SERVICE_ACCOUNT || secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.VEHEREGO_PACKAGE_NAME || 'com.mypyro.veherego' }}
          releaseFiles: "release_assets/*play*.aab"
          tracks: alpha
          whatsNewDirectory: release_notes
          status: completed
          changesNotSentForReview: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check Deployment Status
        run: |
          echo "Production Track Deployment Result: ${{ steps.deploy_production.outcome }}"
          echo "Alpha Track Deployment Result: ${{ steps.deploy_alpha.outcome }}"
          if [ "${{ steps.deploy_production.outcome }}" != "success" ] && [ "${{ steps.deploy_alpha.outcome }}" != "success" ]; then
            echo "::error::Both Production and Alpha deployments failed!"
            exit 1
          fi
