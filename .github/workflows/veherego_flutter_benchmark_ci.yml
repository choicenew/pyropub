name: "[VehereGo] CI & Benchmark Test Workflow"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze-and-test:
    name: 1. Flutter Analyze, Unit, E2E & Benchmark Tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, 'test cli')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get PR SHA (if triggered by comment)
        if: github.event_name == 'issue_comment'
        id: pr_sha
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT }}
          ref: ${{ steps.pr_sha.outputs.sha || github.sha }}

      - name: Locate Flutter Project
        run: |
          VEHEREGO_DIR=$(find veherego -type f -name pubspec.yaml -print0 | while IFS= read -r -d '' manifest; do
            project_dir=${manifest%/pubspec.yaml}
            if [ -d "$project_dir/android" ]; then
              printf '%s' "$project_dir"
              break
            fi
          done)
          if [ -z "$VEHEREGO_DIR" ]; then
            echo "Unable to locate the VehereGo Flutter project"
            find veherego -name pubspec.yaml -print
            exit 1
          fi
          echo "VEHEREGO_DIR=$VEHEREGO_DIR" >> "$GITHUB_ENV"
          echo "Using Flutter project at $VEHEREGO_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Preprocess & Sync Latest Global Brands & Holidays
        working-directory: ./veherego
        run: |
          dart run tools/sync_simple_icons.dart
          dart run tools/sync_holiday_catalog.dart
          dart run tools/sync_l10n.dart

      - name: Install Project Dependencies
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Run Flutter Static Analysis
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Full Test Suite, UI Flow & Stress Benchmarks
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          if [ -d "test" ]; then
            flutter test --reporter expanded
          else
            echo "ℹ️ 未检测到 test/ 测试目录，安全跳过。"
          fi