name: "[PyroMagma] Build Fast Track Debug APK (Optimized)"

on:
  workflow_dispatch:
    inputs:
      include_all_plugins:
        description: 'Include ALL sample plugins (Default: false = Academic plugins only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pyro-global-governance-lock-optimized
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_debug:
    name: Build Fast Debug APK & GitHub Release (Optimized)
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          # 保留 NDK 缓存路径以便命中缓存或清理无用版本
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout pyropub
        uses: actions/checkout@v4

      - name: Checkout pyro_magma
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pyro_magma
          path: pyro_magma
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Checkout packages
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/packages
          path: packages
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Checkout legado_parser
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/legado_parser
          path: legado_parser
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Inject Prebuilt Supported Languages JSON
        run: |
          mkdir -p packages/pyro_api_translate/assets
          if [ -f "supported_languages.json" ]; then
            cp supported_languages.json packages/pyro_api_translate/assets/supported_languages.json
            echo "✓ 已将仓库预置的 supported_languages.json 注入 packages/pyro_api_translate/assets/"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-v1"

      # 优化 Gradle 依赖缓存：仅缓存 modules-2 与 wrapper，剔除导致 Post Cache 超时数分钟的庞大临时构建产物
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pyro_magma/**/*.gradle*', 'pyro_magma/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Dependencies & Upgrade Git Packages
        working-directory: ./pyro_magma
        run: |
          flutter pub upgrade onnxruntime_v2
          flutter pub get

      - name: Sync L10n to Native Android & iOS Strings
        working-directory: ./pyro_magma
        run: |
          dart run tools/sync_l10n.dart

      - name: Extract Dynamic Version from pubspec.yaml
        working-directory: ./pyro_magma
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format='%h - %s')" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Debug Version] 版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Decode keystore and create key.properties
        working-directory: ./pyro_magma
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.PYROMAGMA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PYROMAGMA_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
            echo "storePassword=${{ secrets.PYROMAGMA_KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.PYROMAGMA_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.PYROMAGMA_KEYSTORE_ALIAS }}" >> android/key.properties
            echo "storeFile=key.jks" >> android/key.properties
          fi

      - name: ✂️ Prune Sample Plugins (Play Store / Academic Compliance Guard)
        run: |
          MODE="academic_only"
          if [ "${{ github.event.inputs.include_all_plugins }}" == "true" ]; then
            MODE="all"
          fi
          echo "Executing sample plugin pruning task with mode: $MODE"
          python pyro_magma/tools/prune_sample_plugins.py "$MODE"

      - name: Build Fast Debug APK
        working-directory: ./pyro_magma
        run: |
          echo "=========================================================================="
          echo "📦 开始编译日常快速测试 Debug APK (启用 Android NDK 与 Gradle 缓存加速)..."
          echo "=========================================================================="
          flutter build apk --debug --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          echo "=========================================================================="
          echo "✅ Debug APK 编译完成！"
          echo "=========================================================================="

      - name: Prepare Debug Asset
        working-directory: ./pyro_magma
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-debug.apk release_assets/pyro_magma-v${{ env.APP_VERSION }}-debug.apk
          ls -lh release_assets/

      - name: Publish Test Build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pyromagma-v${{ env.APP_VERSION }}-debug-opt
          name: "pyromagma Test Build (Optimized) v${{ env.APP_VERSION }}"
          body: |
            ## pyromagma - 测试构建 #${{ github.run_number }}
            - **应用名**: `pyromagma`
            - **版本**: `${{ env.APP_VERSION }}`
            - **最新 Commit**: `${{ env.COMMIT_MSG }}`
            - **说明**: 用于日常测试与验证的测试包。
          draft: false
          prerelease: true
          files: ./pyro_magma/release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
