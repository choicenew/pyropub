          path: ./veherego/packages/vehere_yijing_compass/release_assets/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vehere_yijing_compass-v${{ env.APP_VERSION }}
          name: "vehere_yijing_compass Release v${{ env.APP_VERSION }}"
          body: |
            ## vehere_yijing_compass - 构建 #${{ env.APP_BUILD_NUMBER }}
            - **应用**: `vehere_yijing_compass`
            - **版本号**: `${{ env.APP_VERSION }}`
            - **最新 Commit 记录**: `${{ env.COMMIT_MSG }}`
            - **产物文件**:
              - `vehere_yijing_compass-v${{ env.APP_VERSION }}-release.apk` (正式签名包)
              - `vehere_yijing_compass-v${{ env.APP_VERSION }}-debug.apk` (开发调试包)
          draft: false
