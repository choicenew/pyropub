name: "[Vehere Sub-Apps] Build Perk Dock, Yijing Compass & Notification Filter APK"

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: '选择需要编译的子应用 (all / perk_dock / yijing_compass / notification_filter)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - perk_dock
          - yijing_compass
          - notification_filter
  push:
    tags:
      - 'v-sub-*'

permissions:
  contents: write

jobs:
  build_perk_dock:
    name: Build Vehere Perk Dock APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target_app == 'all' || github.event.inputs.target_app == 'perk_dock'

    steps:
      - name: Checkout veherego Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          if [ -f "pubspec.yaml" ]; then
            BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format='%h - %s')" >> $GITHUB_ENV
          echo "🏷️ [Vehere Perk Dock] 版本号: ${APP_VER}+${BUILD_NUM}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and create key.properties
        run: |
          TARGET_ANDROID_DIR="veherego/packages/vehere_perk_dock/android"
          mkdir -p ${TARGET_ANDROID_DIR}/app
          echo "${{ secrets.PERK_DOCK_KEYSTORE_BASE64 }}" | base64 -d > ${TARGET_ANDROID_DIR}/app/key.jks
          echo "storePassword=${{ secrets.PERK_DOCK_KEYSTORE_PASSWORD }}" > ${TARGET_ANDROID_DIR}/key.properties
          echo "keyPassword=${{ secrets.PERK_DOCK_KEY_PASSWORD }}" >> ${TARGET_ANDROID_DIR}/key.properties
          echo "keyAlias=${{ secrets.PERK_DOCK_KEYSTORE_ALIAS }}" >> ${TARGET_ANDROID_DIR}/key.properties
          echo "storeFile=key.jks" >> ${TARGET_ANDROID_DIR}/key.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          flutter pub get
          flutter gen-l10n 2>/dev/null || true

      - name: Build Debug & Release APK
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          echo "📦 开始编译 Vehere Perk Dock..."
          flutter build apk --debug --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation || true
          
          mkdir -p release_assets
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk release_assets/vehere_perk_dock-v${{ env.APP_VERSION }}-debug.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_assets/vehere_perk_dock-v${{ env.APP_VERSION }}-release.apk
          fi
          ls -lh release_assets/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vehere_perk_dock-v${{ env.APP_VERSION }}-apk
          path: ./veherego/packages/vehere_perk_dock/release_assets/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vehere_perk_dock-v${{ env.APP_VERSION }}
          name: "vehere_perk_dock Release v${{ env.APP_VERSION }}"
          body: |
            ## vehere_perk_dock - 构建 #${{ env.APP_BUILD_NUMBER }}
            - **应用**: `vehere_perk_dock`
            - **版本号**: `${{ env.APP_VERSION }}`
            - **最新 Commit 记录**: `${{ env.COMMIT_MSG }}`
            - **产物文件**:
              - `vehere_perk_dock-v${{ env.APP_VERSION }}-release.apk` (正式签名包)
              - `vehere_perk_dock-v${{ env.APP_VERSION }}-debug.apk` (开发调试包)
          draft: false
          prerelease: true
          files: ./veherego/packages/vehere_perk_dock/release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

